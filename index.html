<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CAFE STORY">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3e2112">
<meta name="robots" content="noindex, nofollow">
<title>CAFE STORY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=Cutive&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fbf6ea;
    --aqua: #dcefee;
    --brown: #3e2112;
    --brown-2: #5b3319;
    --brown-soft: #7a5a47;
    --teal: #4aa3a2;
    --teal-dark: #3a8584;
    --gold: #c9a43a;
    --gold-light: #e8cf7a;
    --rose: #c9707a;
    --line: #cdbf9f;
    --check-a: #ffffff;
    --check-b: #efe9d9;
    --serif: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "游明朝", serif;
    --type: "Cutive", "Courier New", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100%;
    color: var(--brown);
    font-family: var(--serif);
    background-color: var(--cream);
    background-image: repeating-linear-gradient(90deg, var(--aqua) 0, var(--aqua) 34px, var(--cream) 34px, var(--cream) 68px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
    -webkit-user-select: none;
    user-select: none;
  }

  /* ヘッダー：茶色の帯＋波のふち＋金のエンブレム */
  header {
    position: relative;
    height: calc(env(safe-area-inset-top, 0px) + 62px);
    background: linear-gradient(var(--brown) 0, var(--brown) env(safe-area-inset-top, 0px), var(--brown-2) env(safe-area-inset-top, 0px));
    margin-bottom: 14px;
  }
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -13px;
    height: 13px;
    background: radial-gradient(circle at 13px 0, var(--brown-2) 13px, transparent 13.5px) 0 0 / 26px 13px repeat-x;
  }
  .crest {
    position: absolute;
    left: 50%;
    bottom: -52px;
    transform: translateX(-50%);
    width: 128px;
    height: 104px;
    z-index: 3;
    filter: drop-shadow(0 3px 3px rgba(62, 33, 18, .35));
  }
  .crest-shape {
    position: absolute; inset: 0;
    background: linear-gradient(145deg, var(--gold-light), var(--gold) 55%, #b08a28);
    clip-path: polygon(0 0, 100% 0, 100% 74%, 50% 100%, 0 74%);
  }
  .crest-shape::after {
    content: "";
    position: absolute; inset: 5px;
    border: 1px solid rgba(255, 246, 214, .85);
    clip-path: polygon(0 0, 100% 0, 100% 74%, 50% 100%, 0 74%);
  }
  .crest-text {
    position: absolute; inset: 0 0 24px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--brown-2);
    font-style: italic;
    font-weight: 700;
    line-height: 1.05;
    font-size: 22px;
    letter-spacing: .02em;
  }
  .crest-text small { font-size: 10px; font-style: normal; letter-spacing: .2em; margin-top: 4px; font-family: var(--type); font-weight: 400; }

  /* セクション見出し */
  .sec-head { text-align: center; padding: 70px 20px 14px; }
  .orn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    max-width: 300px; margin: 0 auto;
    color: var(--brown-soft); font-size: 18px; line-height: 1;
  }
  .orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: var(--brown-soft); }
  h2.sec-title { margin: 10px 0 8px; font-size: 24px; font-weight: 700; letter-spacing: .14em; }
  .sec-en { font-family: var(--type); font-size: 12px; letter-spacing: .16em; color: var(--brown-soft); margin: -2px 0 10px; }

  /* タブ（丸いチップ） */
  .tabs {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 16px;
    background: rgba(251, 246, 234, .96);
    border-top: 1px solid var(--brown-soft);
    border-bottom: 1px solid var(--brown-soft);
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    border: 1px solid var(--brown);
    background: transparent;
    color: var(--brown);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--brown); color: var(--cream); }
  .tab:focus-visible, .item:focus-visible, .close:focus-visible { outline: 3px solid var(--teal-dark); outline-offset: 2px; }

  .count { margin: 12px 20px 0; text-align: right; font-style: italic; font-size: 14px; color: var(--brown-soft); }

  /* 素材カード */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 12px 16px 0;
    max-width: 880px;
    margin: 0 auto;
  }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .item {
    display: flex;
    flex-direction: column;
    border: 0;
    padding: 12px 10px 14px;
    background: #ffffff;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(62, 33, 18, .14);
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .item:active { transform: scale(.97); }
  .thumb {
    display: block;
    aspect-ratio: 1 / 1;
    background-color: var(--check-a);
    background-image:
      linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%),
      linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%);
    background-size: 14px 14px;
    background-position: 0 0, 7px 7px;
    border-radius: 4px;
    padding: 6px;
    margin-bottom: 12px;
  }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .en {
    display: block;
    font-family: var(--type);
    font-size: 12px;
    letter-spacing: .1em;
    padding-bottom: 3px;
    border-bottom: 1px solid #a8c9c8;
    margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .name { display: block; font-size: 15px; line-height: 1.4; font-weight: 700; letter-spacing: .06em; }
  .pill {
    display: block;
    margin-top: 14px;
    background: var(--teal);
    color: #ffffff;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .1em;
    padding: 10px 0;
    border-radius: 999px;
  }
  .item.done .pill { background: var(--gold); color: var(--brown); }

  .hint { margin: 28px 20px 0; text-align: center; font-size: 12px; letter-spacing: .06em; color: var(--brown-soft); }

  /* トースト */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    transform: translate(-50%, 24px);
    background: var(--brown);
    color: var(--cream);
    border-bottom: 3px solid var(--teal);
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .08em;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 30;
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ダイアログ */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(62, 33, 18, .6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: #ffffff;
    border: 1.5px solid var(--brown);
    outline: 1px solid var(--gold);
    outline-offset: -7px;
    border-radius: 8px;
    padding: 28px 24px 22px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    -webkit-user-select: auto;
    user-select: auto;
  }
  .sheet h2 { margin: 0 0 12px; font-size: 19px; font-weight: 900; letter-spacing: .1em; }
  .sheet p { margin: 0 0 18px; font-size: 15px; line-height: 1.9; }
  .sheet .preview {
    border-radius: 4px;
    background-color: var(--check-a);
    background-image:
      linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%),
      linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%);
    background-size: 14px 14px;
    background-position: 0 0, 7px 7px;
    padding: 12px;
    margin-bottom: 18px;
  }
  .sheet .preview img {
    display: block; width: 100%; height: auto;
    -webkit-touch-callout: default;
    -webkit-user-select: auto;
    user-select: auto;
  }
  .close {
    width: 100%;
    border: 0;
    background: var(--teal);
    color: #ffffff;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .12em;
    padding: 13px;
    border-radius: 999px;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .toast, .item { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="crest" aria-hidden="true">
    <div class="crest-shape"></div>
    <div class="crest-text">Cafe<br>Story<small>STICKER</small></div>
  </div>
</header>

<section class="sec-head">
  <div class="orn" aria-hidden="true">♔</div>
  <h2 class="sec-title" id="secTitle"></h2>
  <div class="sec-en" id="secEn"></div>
  <div class="orn" aria-hidden="true">❦</div>
</section>

<nav class="tabs" role="tablist" id="tabs"></nav>
<p class="count" id="count"></p>
<main class="grid" id="grid"></main>
<p class="hint">テスト版 ／ 市松模様は「透明」の目印です</p>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* =====================================================
   素材リスト
   ─────────────────────────────────────────────────────
   ・TABS  : タブの一覧（id / 表示名 / 英語名）
   ・ITEMS : 素材の一覧
       tab   … 属するタブの id
       name  … 画面に出る名前
       en    … 名前の上に出る英語の小さなラベル
       src   … 本物のPNGのパス（例: "images/new.png"）
               書かない（null）場合はダミー画像を自動生成
       dummy … ダミー画像の見た目（text / color / shape）

   素材を追加するとき:
     1. images/ などのフォルダにPNGを置く
     2. 下のITEMSに1行コピーして、name / en / src を書き換える
        例: { tab: "cake", name: "いちごのケーキ", en: "Watercolor", src: "images/w-strawberry-cake.png" },
     3. 新しいタブが欲しいときは TABS に1行足す
   ===================================================== */
const TABS = [
  { id: "cake",  label: "ケーキ",     en: "Cake" },
  { id: "lunch", label: "ランチ",     en: "Lunch" },
  { id: "info",  label: "お知らせ",   en: "Information" },
  { id: "deco",  label: "小物・装飾", en: "Goods" }
];

// en（英語ラベル）は絵柄の名前: Watercolor=水彩 / Gold Frame=金枠 / Navy=ネイビー
const ITEMS = [
  // ── ケーキ ──
  { tab: "cake", name: "本日のケーキ", en: "Watercolor", src: "images/w-cake-today.png" },
  { tab: "cake", name: "本日のケーキ", en: "Gold Frame", src: "images/g-cake-today.png" },
  { tab: "cake", name: "本日のケーキ", en: "Navy",       src: "images/n-cake-today.png" },
  { tab: "cake", name: "今月のケーキ", en: "Watercolor", src: "images/w-cake-month.png" },
  { tab: "cake", name: "今月のケーキ", en: "Gold Frame", src: "images/g-cake-month.png" },
  { tab: "cake", name: "今月のケーキ", en: "Navy",       src: "images/n-cake-month.png" },

  // ── ランチ ──
  { tab: "lunch", name: "本日のランチ", en: "Watercolor", src: "images/w-lunch.png" },
  { tab: "lunch", name: "本日のランチ", en: "Gold Frame", src: "images/g-lunch.png" },
  { tab: "lunch", name: "本日のランチ", en: "Navy",       src: "images/n-lunch.png" },

  // ── お知らせ ──
  { tab: "info", name: "営業時間",           en: "Watercolor", src: "images/w-info-hours.png" },
  { tab: "info", name: "営業時間",           en: "Gold Frame", src: "images/g-info-hours.png" },
  { tab: "info", name: "営業時間",           en: "Navy",       src: "images/n-info-hours.png" },
  { tab: "info", name: "ご来店お待ちしております", en: "Watercolor", src: "images/w-info-welcome.png" },
  { tab: "info", name: "ご来店お待ちしております", en: "Gold Frame", src: "images/g-info-welcome.png" },
  { tab: "info", name: "ご来店お待ちしております", en: "Navy",       src: "images/n-info-welcome.png" },
  { tab: "info", name: "お知らせ",           en: "Watercolor", src: "images/w-info-notice.png" },
  { tab: "info", name: "お知らせ",           en: "Gold Frame", src: "images/g-info-notice.png" },
  { tab: "info", name: "お知らせ",           en: "Navy",       src: "images/n-info-notice.png" },

  // ── 小物・装飾 ──
  { tab: "deco", name: "いちごを抱えたくま", en: "Watercolor", src: "images/w-bear-strawberry.png" },
  { tab: "deco", name: "いちご",             en: "Watercolor", src: "images/w-strawberry.png" },
  { tab: "deco", name: "ショートケーキ",     en: "Watercolor", src: "images/w-cake-slice.png" },
  { tab: "deco", name: "カップケーキ",       en: "Watercolor", src: "images/w-cupcake.png" },
  { tab: "deco", name: "王冠",               en: "Watercolor", src: "images/w-crown.png" },
  { tab: "deco", name: "ハート",             en: "Watercolor", src: "images/w-heart.png" },
  { tab: "deco", name: "リボン",             en: "Watercolor", src: "images/w-bow.png" },
  { tab: "deco", name: "肉球",               en: "Watercolor", src: "images/w-paw.png" },
  { tab: "deco", name: "いちご",             en: "Navy", src: "images/n-strawberry.png" },
  { tab: "deco", name: "ショートケーキ",     en: "Navy", src: "images/n-cake-slice.png" },
  { tab: "deco", name: "ティーポット",       en: "Navy", src: "images/n-teapot.png" },
  { tab: "deco", name: "ティーカップ",       en: "Navy", src: "images/n-teacup.png" },
  { tab: "deco", name: "スコーン",           en: "Navy", src: "images/n-scones.png" },
  { tab: "deco", name: "ユニオンジャック",   en: "Navy", src: "images/n-flag.png" }
];

/* ===================== ダミー画像（透過PNG）を生成 ===================== */
const FONT = '"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif';

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawDummy(d) {
  const W = 800, H = 400;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d"); // 背景は塗らない = 透明
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  if (d.shape === "badge") {
    roundRect(ctx, 40, 90, W - 80, H - 180, 110);
    ctx.fillStyle = d.color; ctx.fill();
    ctx.lineWidth = 12; ctx.strokeStyle = "#fbf6ea"; ctx.stroke();
    roundRect(ctx, 64, 114, W - 128, H - 228, 86);
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(251,246,234,.7)"; ctx.stroke();
    ctx.fillStyle = "#fbf6ea";
    let size = 120;
    ctx.font = "900 " + size + "px " + FONT;
    while (ctx.measureText(d.text).width > W - 240 && size > 40) {
      size -= 6; ctx.font = "900 " + size + "px " + FONT;
    }
    ctx.fillText(d.text, W / 2, H / 2 + 6);
  } else if (d.shape === "bubble") {
    roundRect(ctx, 60, 50, W - 120, 240, 120);
    ctx.fillStyle = "#fbf6ea"; ctx.fill();
    ctx.lineWidth = 10; ctx.strokeStyle = d.color; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(330, 285); ctx.lineTo(300, 360); ctx.lineTo(420, 288);
    ctx.fillStyle = "#fbf6ea"; ctx.fill();
    ctx.strokeStyle = d.color; ctx.stroke();
    ctx.fillStyle = d.color;
    ctx.font = "900 105px " + FONT;
    ctx.fillText(d.text, W / 2, 170);
  } else {
    ctx.fillStyle = d.color;
    ctx.font = "330px " + FONT;
    ctx.fillText(d.text, W / 2, H / 2 + 14);
  }
  return c;
}

const dummyCache = new Map();
function dummyCanvas(item) {
  if (!dummyCache.has(item)) dummyCache.set(item, drawDummy(item.dummy));
  return dummyCache.get(item);
}

/* ===================== PNG の Blob を用意 ===================== */
// Safari は「クリック直後に ClipboardItem を作る」必要があるため、
// Blob は Promise のまま渡す。
function getBlob(item) {
  if (item.src) {
    return fetch(item.src)
      .then(function (r) {
        if (!r.ok) throw new Error("fetch failed");
        return r.blob();
      })
      .then(function (b) {
        return b.type === "image/png" ? b : new Blob([b], { type: "image/png" });
      });
  }
  return new Promise(function (resolve, reject) {
    dummyCanvas(item).toBlob(function (b) {
      b ? resolve(b) : reject(new Error("toBlob failed"));
    }, "image/png");
  });
}

function thumbURL(item) {
  return item.src ? item.src : dummyCanvas(item).toDataURL("image/png");
}

/* ===================== 画面 ===================== */
const tabsEl = document.getElementById("tabs");
const gridEl = document.getElementById("grid");
const toastEl = document.getElementById("toast");
const overlayEl = document.getElementById("overlay");
const sheetEl = document.getElementById("sheet");
const secTitleEl = document.getElementById("secTitle");
const secEnEl = document.getElementById("secEn");
const countEl = document.getElementById("count");
let currentTab = TABS[0].id;
let toastTimer = null;

function renderTabs() {
  tabsEl.innerHTML = "";
  TABS.forEach(function (t) {
    const b = document.createElement("button");
    b.className = "tab";
    b.type = "button";
    b.role = "tab";
    b.textContent = t.label;
    b.setAttribute("aria-selected", t.id === currentTab ? "true" : "false");
    b.addEventListener("click", function () {
      currentTab = t.id;
      renderTabs();
      renderGrid();
    });
    tabsEl.appendChild(b);
  });
}

function renderGrid() {
  const tab = TABS.filter(function (t) { return t.id === currentTab; })[0];
  const list = ITEMS.filter(function (i) { return i.tab === currentTab; });
  secTitleEl.textContent = tab.label;
  secEnEl.textContent = tab.en;
  countEl.textContent = list.length + "個の素材";

  gridEl.innerHTML = "";
  list.forEach(function (item) {
    const btn = document.createElement("button");
    btn.className = "item";
    btn.type = "button";
    btn.setAttribute("aria-label", item.name + " をコピー");

    const thumb = document.createElement("span");
    thumb.className = "thumb";
    const img = document.createElement("img");
    img.alt = "";
    img.src = thumbURL(item);
    img.loading = "lazy";
    img.decoding = "async";
    thumb.appendChild(img);

    const en = document.createElement("span");
    en.className = "en";
    en.textContent = item.en || "";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;

    const pill = document.createElement("span");
    pill.className = "pill";
    pill.textContent = "コピーする ›";

    btn.appendChild(thumb);
    btn.appendChild(en);
    btn.appendChild(name);
    btn.appendChild(pill);
    btn.addEventListener("click", function () { copyItem(item, btn, pill); });
    gridEl.appendChild(btn);
  });
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
}

function copyItem(item, btn, pill) {
  // ClipboardItem をクリック処理の中で同期的に作る（Safari対策）
  let write;
  try {
    write = navigator.clipboard.write([
      new ClipboardItem({ "image/png": getBlob(item) })
    ]);
  } catch (e) {
    openFallback(item);
    return;
  }
  write.then(function () {
    btn.classList.add("done");
    pill.textContent = "コピーしました ✓";
    showToast("コピーしました");
  }).catch(function () {
    openFallback(item);
  });
}

/* 自動コピーに失敗したとき: 長押しコピーに切り替える */
function openFallback(item) {
  sheetEl.innerHTML = "";
  const h = document.createElement("h2");
  h.id = "sheetTitle";
  h.textContent = "画像を長押ししてコピー";
  const p = document.createElement("p");
  p.textContent = "自動でコピーできませんでした。下の画像を長押しして「コピー」を選んでください。";
  const box = document.createElement("div");
  box.className = "preview";
  const img = document.createElement("img");
  img.alt = item.name;
  img.src = thumbURL(item);
  box.appendChild(img);
  const close = document.createElement("button");
  close.className = "close";
  close.type = "button";
  close.textContent = "閉じる";
  close.addEventListener("click", closeSheet);
  sheetEl.appendChild(h); sheetEl.appendChild(p); sheetEl.appendChild(box); sheetEl.appendChild(close);
  overlayEl.classList.add("open");
}

/* 初回だけ使い方を表示 */
function openGuide() {
  sheetEl.innerHTML = "";
  const h = document.createElement("h2");
  h.id = "sheetTitle";
  h.textContent = "使い方";
  const p = document.createElement("p");
  p.innerHTML = "素材をタップすると、画像がコピーされます。<br>Instagramのストーリーで画面を長押しして、<br>「ペースト」を選んでください。";
  const close = document.createElement("button");
  close.className = "close";
  close.type = "button";
  close.textContent = "わかった";
  close.addEventListener("click", function () {
    try { localStorage.setItem("cafeStoryGuideSeen", "1"); } catch (e) {}
    closeSheet();
  });
  sheetEl.appendChild(h); sheetEl.appendChild(p); sheetEl.appendChild(close);
  overlayEl.classList.add("open");
}

function closeSheet() { overlayEl.classList.remove("open"); }
overlayEl.addEventListener("click", function (e) { if (e.target === overlayEl) closeSheet(); });

renderTabs();
renderGrid();

let seen = false;
try { seen = localStorage.getItem("cafeStoryGuideSeen") === "1"; } catch (e) {}
if (!seen) openGuide();
</script>
</body>
</html>
