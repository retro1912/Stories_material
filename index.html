<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CAFE STORY">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3e2112">
<meta name="robots" content="noindex, nofollow">
<title>CAFE STORY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=Cutive&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fbf6ea;
    --aqua: #dcefee;
    --brown: #3e2112;
    --brown-2: #5b3319;
    --brown-soft: #7a5a47;
    --teal: #4aa3a2;
    --teal-dark: #3a8584;
    --gold: #c9a43a;
    --gold-light: #e8cf7a;
    --rose: #c9707a;
    --line: #cdbf9f;
    --check-a: #ffffff;
    --check-b: #efe9d9;
    --serif: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "游明朝", serif;
    --type: "Cutive", "Courier New", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100%;
    color: var(--brown);
    font-family: var(--serif);
    background-color: var(--cream);
    background-image: repeating-linear-gradient(90deg, var(--aqua) 0, var(--aqua) 34px, var(--cream) 34px, var(--cream) 68px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
    -webkit-user-select: none;
    user-select: none;
  }

  /* ヘッダー：茶色の帯＋波のふち＋金のエンブレム */
  header {
    position: relative;
    height: calc(env(safe-area-inset-top, 0px) + 62px);
    background: linear-gradient(var(--brown) 0, var(--brown) env(safe-area-inset-top, 0px), var(--brown-2) env(safe-area-inset-top, 0px));
    margin-bottom: 14px;
  }
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -13px;
    height: 13px;
    background: radial-gradient(circle at 13px 0, var(--brown-2) 13px, transparent 13.5px) 0 0 / 26px 13px repeat-x;
  }
  .crest {
    position: absolute;
    left: 50%;
    bottom: -52px;
    transform: translateX(-50%);
    width: 128px;
    height: 104px;
    z-index: 3;
    filter: drop-shadow(0 3px 3px rgba(62, 33, 18, .35));
  }
  .crest-shape {
    position: absolute; inset: 0;
    background: linear-gradient(145deg, var(--gold-light), var(--gold) 55%, #b08a28);
    clip-path: polygon(0 0, 100% 0, 100% 74%, 50% 100%, 0 74%);
  }
  .crest-shape::after {
    content: "";
    position: absolute; inset: 5px;
    border: 1px solid rgba(255, 246, 214, .85);
    clip-path: polygon(0 0, 100% 0, 100% 74%, 50% 100%, 0 74%);
  }
  .crest-text {
    position: absolute; inset: 0 0 24px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--brown-2);
    font-style: italic;
    font-weight: 700;
    line-height: 1.05;
    font-size: 22px;
    letter-spacing: .02em;
  }
  .crest-text small { font-size: 10px; font-style: normal; letter-spacing: .2em; margin-top: 4px; font-family: var(--type); font-weight: 400; }

  /* セクション見出し */
  .sec-head { text-align: center; padding: 70px 20px 14px; }
  .orn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    max-width: 300px; margin: 0 auto;
    color: var(--brown-soft); font-size: 18px; line-height: 1;
  }
  .orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: var(--brown-soft); }
  h2.sec-title { margin: 10px 0 8px; font-size: 24px; font-weight: 700; letter-spacing: .14em; }
  .sec-en { font-family: var(--type); font-size: 12px; letter-spacing: .16em; color: var(--brown-soft); margin: -2px 0 10px; }

  /* タブ（丸いチップ） */
  .tabs {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 16px;
    background: rgba(251, 246, 234, .96);
    border-top: 1px solid var(--brown-soft);
    border-bottom: 1px solid var(--brown-soft);
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    border: 1px solid var(--brown);
    background: transparent;
    color: var(--brown);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--brown); color: var(--cream); }
  .tab:focus-visible, .item:focus-visible, .close:focus-visible { outline: 3px solid var(--teal-dark); outline-offset: 2px; }

  .count { margin: 12px 20px 0; text-align: right; font-style: italic; font-size: 14px; color: var(--brown-soft); }

  /* 素材カード */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 12px 16px 0;
    max-width: 880px;
    margin: 0 auto;
  }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .item {
    display: flex;
    flex-direction: column;
    border: 0;
    padding: 12px 10px 14px;
    background: #ffffff;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(62, 33, 18, .14);
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .item:active { transform: scale(.97); }
  .thumb {
    display: block;
    aspect-ratio: 1 / 1;
    background-color: var(--check-a);
    background-image:
      linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%),
      linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%);
    background-size: 14px 14px;
    background-position: 0 0, 7px 7px;
    border-radius: 4px;
    padding: 6px;
    margin-bottom: 12px;
  }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .en {
    display: block;
    font-family: var(--type), var(--serif);
    font-size: 12px;
    letter-spacing: .1em;
    padding-bottom: 3px;
    border-bottom: 1px solid #a8c9c8;
    margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .name { display: block; font-size: 15px; line-height: 1.4; font-weight: 700; letter-spacing: .06em; }
  .pill {
    display: block;
    margin-top: 14px;
    background: var(--teal);
    color: #ffffff;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .1em;
    padding: 10px 0;
    border-radius: 999px;
  }
  .item.done .pill { background: var(--gold); color: var(--brown); }

  .empty { grid-column: 1 / -1; margin: 36px 8px; text-align: center; font-size: 15px; line-height: 2; color: var(--brown-soft); }
  .hint { margin: 28px 20px 0; text-align: center; font-size: 12px; letter-spacing: .06em; color: var(--brown-soft); }

  /* トースト */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    transform: translate(-50%, 24px);
    background: var(--brown);
    color: var(--cream);
    border-bottom: 3px solid var(--teal);
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .08em;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 30;
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ダイアログ */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(62, 33, 18, .6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: #ffffff;
    border: 1.5px solid var(--brown);
    outline: 1px solid var(--gold);
    outline-offset: -7px;
    border-radius: 8px;
    padding: 28px 24px 22px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    -webkit-user-select: auto;
    user-select: auto;
  }
  .sheet h2 { margin: 0 0 12px; font-size: 19px; font-weight: 900; letter-spacing: .1em; }
  .sheet p { margin: 0 0 18px; font-size: 15px; line-height: 1.9; }
  .sheet .preview {
    border-radius: 4px;
    background-color: var(--check-a);
    background-image:
      linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%),
      linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%);
    background-size: 14px 14px;
    background-position: 0 0, 7px 7px;
    padding: 12px;
    margin-bottom: 18px;
  }
  .sheet .preview img {
    display: block; width: 100%; height: auto;
    -webkit-touch-callout: default;
    -webkit-user-select: auto;
    user-select: auto;
  }
  .close {
    width: 100%;
    border: 0;
    background: var(--teal);
    color: #ffffff;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .12em;
    padding: 13px;
    border-radius: 999px;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .toast, .item { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="crest" aria-hidden="true">
    <div class="crest-shape"></div>
    <div class="crest-text">Cafe<br>Story<small>STICKER</small></div>
  </div>
</header>

<section class="sec-head">
  <div class="orn" aria-hidden="true">♔</div>
  <h2 class="sec-title" id="secTitle"></h2>
  <div class="orn" aria-hidden="true">❦</div>
</section>

<nav class="tabs" role="tablist" id="tabs"></nav>
<p class="count" id="count"></p>
<main class="grid" id="grid"></main>
<p class="hint">テスト版 ／ 市松模様は「透明」の目印です</p>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* =====================================================
   素材の追加方法（コードは触りません）
   ─────────────────────────────────────────────────────
   images フォルダにPNGを入れるだけで、ファイル名から
   タブ・タイトル・ラベルが自動で決まります。

   ファイル名のルール:   タブ名_タイトル_ラベル.png
     例) ケーキ_いちごのケーキ_水彩.png
         → 「ケーキ」タブに「いちごのケーキ」、ラベルは「水彩」
     ・ラベルは省略できます（タブ名_タイトル.png）
     ・並び順を決めたいときは、名前の先頭に「01-」のように
       数字とハイフンをつけます（表示では消えます）
         例) 01-ケーキ_02-今月のケーキ_1-水彩.png
   ===================================================== */

const tabsEl = document.getElementById("tabs");
const gridEl = document.getElementById("grid");
const toastEl = document.getElementById("toast");
const overlayEl = document.getElementById("overlay");
const sheetEl = document.getElementById("sheet");
const secTitleEl = document.getElementById("secTitle");
const countEl = document.getElementById("count");
let TABS = [];
let ITEMS = [];
let currentTab = "";
let toastTimer = null;

/* ---------- ファイル名の読み取り ---------- */
function clean(part) { return part.replace(/^\d+-/, "").normalize("NFC"); }
function cmp(a, b) { return a.localeCompare(b, "ja", { numeric: true }); }

function parse(file) {
  const base = file.replace(/\.[^.]+$/, "");
  const parts = base.split("_");
  let tabRaw, titleRaw, labelRaw;
  if (parts.length === 1) { tabRaw = "99-その他"; titleRaw = parts[0]; labelRaw = ""; }
  else { tabRaw = parts[0]; titleRaw = parts[1]; labelRaw = parts.slice(2).join("_"); }
  return {
    file: file,
    src: "images/" + encodeURIComponent(file),
    tabRaw: tabRaw, titleRaw: titleRaw, labelRaw: labelRaw,
    tab: clean(tabRaw), name: clean(titleRaw), en: clean(labelRaw)
  };
}

function setup(list) {
  ITEMS = list.map(parse).sort(function (a, b) {
    return cmp(a.tabRaw, b.tabRaw) || cmp(a.titleRaw, b.titleRaw) || cmp(a.labelRaw, b.labelRaw);
  });
  TABS = [];
  ITEMS.forEach(function (i) {
    if (!TABS.some(function (t) { return t.id === i.tab; })) TABS.push({ id: i.tab, label: i.tab });
  });
  currentTab = TABS.length ? TABS[0].id : "";
  renderTabs();
  renderGrid();
}

/* ---------- PNG の Blob を用意 ---------- */
// Safari は「クリック直後に ClipboardItem を作る」必要があるため、
// Blob は Promise のまま渡す。
function getBlob(item) {
  return fetch(item.src)
    .then(function (r) {
      if (!r.ok) throw new Error("fetch failed");
      return r.blob();
    })
    .then(function (b) {
      return b.type === "image/png" ? b : new Blob([b], { type: "image/png" });
    });
}

/* ---------- 画面 ---------- */
function renderTabs() {
  tabsEl.innerHTML = "";
  TABS.forEach(function (t) {
    const b = document.createElement("button");
    b.className = "tab";
    b.type = "button";
    b.role = "tab";
    b.textContent = t.label;
    b.setAttribute("aria-selected", t.id === currentTab ? "true" : "false");
    b.addEventListener("click", function () {
      currentTab = t.id;
      renderTabs();
      renderGrid();
    });
    tabsEl.appendChild(b);
  });
}

function renderGrid() {
  const list = ITEMS.filter(function (i) { return i.tab === currentTab; });
  secTitleEl.textContent = currentTab;
  countEl.textContent = list.length ? list.length + "個の素材" : "";

  gridEl.innerHTML = "";
  if (!list.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.innerHTML = "まだ素材がありません。<br>images フォルダに画像を追加してください。";
    gridEl.appendChild(p);
    return;
  }
  list.forEach(function (item) {
    const btn = document.createElement("button");
    btn.className = "item";
    btn.type = "button";
    btn.setAttribute("aria-label", item.name + " をコピー");

    const thumb = document.createElement("span");
    thumb.className = "thumb";
    const img = document.createElement("img");
    img.alt = "";
    img.src = item.src;
    img.loading = "lazy";
    img.decoding = "async";
    thumb.appendChild(img);

    btn.appendChild(thumb);
    if (item.en) {
      const en = document.createElement("span");
      en.className = "en";
      en.textContent = item.en;
      btn.appendChild(en);
    }
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;
    btn.appendChild(name);

    const pill = document.createElement("span");
    pill.className = "pill";
    pill.textContent = "コピーする ›";
    btn.appendChild(pill);

    btn.addEventListener("click", function () { copyItem(item, btn, pill); });
    gridEl.appendChild(btn);
  });
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
}

function copyItem(item, btn, pill) {
  // ClipboardItem をクリック処理の中で同期的に作る（Safari対策）
  let write;
  try {
    write = navigator.clipboard.write([
      new ClipboardItem({ "image/png": getBlob(item) })
    ]);
  } catch (e) {
    openFallback(item);
    return;
  }
  write.then(function () {
    btn.classList.add("done");
    pill.textContent = "コピーしました ✓";
    showToast("コピーしました");
  }).catch(function () {
    openFallback(item);
  });
}

/* 自動コピーに失敗したとき: 長押しコピーに切り替える */
function openFallback(item) {
  sheetEl.innerHTML = "";
  const h = document.createElement("h2");
  h.id = "sheetTitle";
  h.textContent = "画像を長押ししてコピー";
  const p = document.createElement("p");
  p.textContent = "自動でコピーできませんでした。下の画像を長押しして「コピー」を選んでください。";
  const box = document.createElement("div");
  box.className = "preview";
  const img = document.createElement("img");
  img.alt = item.name;
  img.src = item.src;
  box.appendChild(img);
  const close = document.createElement("button");
  close.className = "close";
  close.type = "button";
  close.textContent = "閉じる";
  close.addEventListener("click", closeSheet);
  sheetEl.appendChild(h); sheetEl.appendChild(p); sheetEl.appendChild(box); sheetEl.appendChild(close);
  overlayEl.classList.add("open");
}

/* 初回だけ使い方を表示 */
function openGuide() {
  sheetEl.innerHTML = "";
  const h = document.createElement("h2");
  h.id = "sheetTitle";
  h.textContent = "使い方";
  const p = document.createElement("p");
  p.innerHTML = "素材をタップすると、画像がコピーされます。<br>Instagramのストーリーで画面を長押しして、<br>「ペースト」を選んでください。";
  const close = document.createElement("button");
  close.className = "close";
  close.type = "button";
  close.textContent = "わかった";
  close.addEventListener("click", function () {
    try { localStorage.setItem("cafeStoryGuideSeen", "1"); } catch (e) {}
    closeSheet();
  });
  sheetEl.appendChild(h); sheetEl.appendChild(p); sheetEl.appendChild(close);
  overlayEl.classList.add("open");
}

function closeSheet() { overlayEl.classList.remove("open"); }
overlayEl.addEventListener("click", function (e) { if (e.target === overlayEl) closeSheet(); });

/* ---------- 起動 ---------- */
// 素材の一覧は、まずGitHubから直接取得（アップロードするだけで反映される）。
// 取得できないときは images.json を使う。
function listFromGitHub() {
  const host = location.hostname;
  if (!/\.github\.io$/.test(host)) return Promise.reject(new Error("not github pages"));
  const owner = host.replace(/\.github\.io$/, "");
  const seg = location.pathname.split("/")[1];
  const repo = (seg && !/\.html?$/i.test(seg)) ? seg : host;
  try {
    const c = JSON.parse(localStorage.getItem("cafeStoryList") || "null");
    if (c && c.repo === repo && Date.now() - c.t < 5 * 60 * 1000 && c.list.length) return Promise.resolve(c.list);
  } catch (e) {}
  return fetch("https://api.github.com/repos/" + owner + "/" + repo + "/contents/images", {
    headers: { Accept: "application/vnd.github+json" }
  })
    .then(function (r) { if (!r.ok) throw new Error("api"); return r.json(); })
    .then(function (arr) {
      const list = arr
        .filter(function (x) { return x.type === "file" && /\.(png|webp|jpe?g|gif)$/i.test(x.name); })
        .map(function (x) { return x.name; });
      if (!list.length) throw new Error("empty");
      try { localStorage.setItem("cafeStoryList", JSON.stringify({ t: Date.now(), repo: repo, list: list })); } catch (e) {}
      return list;
    });
}

function listFromJson() {
  return fetch("images.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("no list"); return r.json(); });
}

listFromGitHub()
  .catch(listFromJson)
  .then(setup)
  .catch(function () {
    secTitleEl.textContent = "";
    gridEl.innerHTML = "";
    const p = document.createElement("p");
    p.className = "empty";
    p.innerHTML = "素材リストを読み込めませんでした。<br>しばらくしてから開き直してください。";
    gridEl.appendChild(p);
  });

let seen = false;
try { seen = localStorage.getItem("cafeStoryGuideSeen") === "1"; } catch (e) {}
if (!seen) openGuide();
</script>
</body>
</html>
